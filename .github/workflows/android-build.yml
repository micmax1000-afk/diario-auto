name: Build Android APK/AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # Lo spazio per gli artifact è limitato: si tengono solo quelli delle
      # ultime 3 build, gli altri si cancellano prima di caricare i nuovi.
      - name: Cancella gli artifact vecchi
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const runs = [...new Set(artifacts.map((a) => a.workflow_run?.id).filter(Boolean))].sort((a, b) => b - a);
            const keep = new Set(runs.slice(0, 3));
            for (const a of artifacts) {
              if (a.expired || keep.has(a.workflow_run?.id)) continue;
              await github.rest.actions.deleteArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id });
            }
            core.info(`Artifact: ${artifacts.length}, build tenute: ${keep.size}`);

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Test automatici
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK (sempre, utile per test rapidi)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: diario-auto-debug.apk
          retention-days: 14
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # L'AAB firmato si genera solo se i secrets del keystore sono
      # configurati nel repo (Settings → Secrets and variables → Actions).
      # Finché non li aggiungi, questo step e il successivo vengono saltati
      # senza far fallire la build.
      - name: Check release signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.signing.outputs.available == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build release AAB (firmato)
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        run: ./gradlew bundleRelease
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release AAB
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: diario-auto-release.aab
          retention-days: 14
          path: android/app/build/outputs/bundle/release/app-release.aab

      # File per leggere i report di crash del codice offuscato: da caricare in
      # Play Console (App bundle explorer → Download → File di deoffuscamento).
      - name: Upload mapping R8
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: diario-auto-mapping.txt
          retention-days: 14
          path: android/app/build/outputs/mapping/release/mapping.txt

      # AAB e mapping anche in una Release (privata come il repo): non usa lo
      # spazio degli artifact, quindi resta scaricabile anche se è pieno.
      - name: Pubblica AAB e mapping nella Release
        if: steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          cp android/app/build/outputs/bundle/release/app-release.aab "diario-auto-$VERSION.aab"
          cp android/app/build/outputs/mapping/release/mapping.txt "mapping-$VERSION.txt"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "diario-auto-$VERSION.aab" "mapping-$VERSION.txt" --clobber
          else
            gh release create "$VERSION" "diario-auto-$VERSION.aab" "mapping-$VERSION.txt" \
              --target "$GITHUB_SHA" --title "Diario Auto $VERSION" --notes "AAB firmato e mapping.txt per Play Console."
          fi
